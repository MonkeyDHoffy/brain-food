# Konfiguration des brainfood-web-Containers (nginx:alpine) hinter nginx-proxy.
# Liegt auf dem Server unter /opt/brainfood/nginx.conf und wird nach /etc/nginx/conf.d/default.conf gemountet.
# Ausgeliefert wird immer /srv/brainfood/current, ein Link auf den neuesten Stand in releases/ (deploy.sh).

server {
    listen 80 default_server;
    server_name brainfood.hoffja.de;

    root /srv/brainfood/current;
    index index.html;

    # Interne Präsentation: Passwortschutz für Seite, Bilder und Audios. Der Schutz sitzt hier,
    # nginx-proxy bleibt unverändert.
    auth_basic "Brain Food";
    auth_basic_user_file /etc/nginx/brainfood.htpasswd;

    # Nicht in Suchmaschinen; neue Stände sofort sichtbar (unveränderte Dateien kommen als 304).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;

    # Die .gz-Dateien legt deploy.sh neben die Originale; Rückfall: on-the-fly-Komprimierung.
    gzip_static on;
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
