<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c2f2a">
  <title>Brain Food – Reverse Engineering mit KI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23233a34'/%3E%3Cpath fill='%23dcea9e' d='M2 1h4v1h1v4H6v1H2V6H1V2h1z'/%3E%3Cpath fill='%2322654f' d='M3 2h1v4H3zM5 3h1v2H5z'/%3E%3C/svg%3E">
</head>
<body>
  <div id="viewport">
    <div id="stage" class="stage" data-room="none">
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress"></div></div>

      <section class="field" id="field" aria-label="Spielfeld">
        <canvas id="world" aria-hidden="true"></canvas>
        <div class="field-labels" id="fieldLabels"></div>
        <div class="field-head" id="fieldHead">
          <span class="room-tag" id="roomTag">RAUM 1/3</span>
          <span class="room-name" id="roomName">Spielefusionen</span>
          <span class="mode-tag" id="modeTag">MANUELL</span>
        </div>
        <div class="bubble" id="bubble" role="status" aria-live="polite" hidden><p id="bubbleText"></p></div>
        <nav class="hud" id="hud" aria-label="Steuerung"></nav>
      </section>

      <section class="pres" id="pres" aria-label="Präsentation" aria-live="polite"></section>

      <footer class="subtitle" id="subtitleBar">
        <span class="subtitle-meta" id="subtitleMeta"></span>
        <p class="subtitle-text" id="subtitleText"></p>
        <span class="subtitle-keys" id="subtitleKeys"></span>
      </footer>

      <div class="overlay boot" id="boot" hidden></div>
      <div class="overlay menu" id="menu" hidden></div>
      <div class="overlay ending" id="ending" hidden></div>
      <div class="overlay pause" id="pause" hidden></div>
      <div class="overlay help" id="help" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
